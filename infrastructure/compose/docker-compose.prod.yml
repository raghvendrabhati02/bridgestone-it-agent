version: '3.8'

services:
  nginx:
    image: nginx:stable-alpine
    container_name: bridgestone-nginx-prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - bridgestone-network
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  postgres:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/postgres.Dockerfile
    container_name: bridgestone-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: bridgestone_it_agent
      POSTGRES_USER: prod_admin
      POSTGRES_PASSWORD: prod_super_secure_pass
    # Database port is private and accessible only inside composition network
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - bridgestone-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prod_admin -d bridgestone_it_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/redis.Dockerfile
    container_name: bridgestone-redis-prod
    restart: always
    # Redis port is private and accessible only inside composition network
    volumes:
      - redis_data_prod:/data
    networks:
      - bridgestone-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: bridgestone-backend-prod
    restart: always
    env_file:
      - ../env/prod.env
    # Backend API port is private and accessible only inside composition network
    networks:
      - bridgestone-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
    container_name: bridgestone-frontend-prod
    restart: always
    # Next.js port is private and accessible only inside composition network
    networks:
      - bridgestone-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: bridgestone-prometheus-prod
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus:/etc/prometheus
    networks:
      - bridgestone-network

  grafana:
    image: grafana/grafana:latest
    container_name: bridgestone-grafana-prod
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - bridgestone-network
    depends_on:
      - prometheus

volumes:
  postgres_data_prod:
  redis_data_prod:
  grafana_data:

networks:
  bridgestone-network:
    name: bridgestone-network
    driver: bridge
