# Backend-only compose: runs postgres + redis + backend with port 8000 exposed.
# Use this when running the Next.js frontend locally with `npm run dev`.
#
# Usage:
#   docker compose -f infrastructure/compose/docker-compose.backend-only.yml up -d
#   cd frontend && npm run dev
#
services:
  postgres:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/postgres.Dockerfile
    container_name: bridgestone-postgres-local
    restart: always
    environment:
      POSTGRES_DB: bridgestone_it_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    networks:
      - bridgestone-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bridgestone_it_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/redis.Dockerfile
    container_name: bridgestone-redis-local
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data_local:/data
    networks:
      - bridgestone-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: bridgestone-backend-local
    restart: always
    env_file:
      - ../env/dev.env
    # Expose port 8000 so the locally-running Next.js frontend can reach it
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app
    networks:
      - bridgestone-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_local:
  redis_data_local:

networks:
  bridgestone-network:
    name: bridgestone-network
    driver: bridge
