groups:
  - name: bridgestone-alerts
    rules:
      # 1. Alert if backend container is unreachable
      - alert: BackendDown
        expr: up{job="backend-metrics"} == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "FastAPI Backend is unreachable"
          description: "The backend container is reported as down. AI troubleshooting agent is offline."

      # 2. Alert if SQL Database goes offline
      - alert: DatabaseDown
        expr: db_failures_total > 5
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL Database connections failing"
          description: "Database connection checks or queries are actively failing. Data writes are disabled."

      # 3. Alert if Redis Cache goes offline
      - alert: RedisDown
        expr: redis_availability == 0
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "Redis Cache is unreachable"
          description: "Redis caching service is reported as down. System performance may degrade."

      # 4. Alert if Gemini LLM failure rate is high
      - alert: GeminiHighFailRate
        expr: (increase(llm_failures_total[5m]) / increase(llm_requests_total[5m])) > 0.1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Gemini API error rate is high"
          description: "Over 10% of LLM calls are failing. Check API key configurations and API availability."

      # 5. Alert if there are excessive SLA breaches
      - alert: SlaBreachThreshold
        expr: increase(business_sla_breaches_total[5m]) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "SLA breach rate threshold exceeded"
          description: "IT Support tickets are breaching assigned SLA hours. Team resource constraints detected."

      # 6. Alert if there is a security credential brute force attack
      - alert: AuthenticationFailureSpike
        expr: increase(security_failed_logins_total[5m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Spike in failed authentication requests"
          description: "Spike of over 5 failed logins within 5 minutes. Potential brute-force attack on /auth/login."

      # 7. Alert if ServiceNow API failure rate is high
      - alert: ServiceNowHighFailRate
        expr: (increase(servicenow_failures_total[5m]) / (increase(servicenow_requests_total[5m]) + 1)) > 0.2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ServiceNow API failure rate is high"
          description: "Over 20% of ServiceNow API calls are failing in the last 5 minutes. Incident creation may be blocked."

      # 8. Alert if ServiceNow API latency is high (p95 > 10s)
      - alert: ServiceNowHighLatency
        expr: histogram_quantile(0.95, rate(servicenow_latency_seconds_bucket[5m])) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "ServiceNow API latency is elevated"
          description: "95th percentile ServiceNow API latency exceeds 10 seconds. User-facing ticket creation will be slow."

      # 9. Alert if AI provider model fallback rate is high
      - alert: AIProviderFallbackSpike
        expr: increase(llm_model_fallback_total[5m]) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "AI provider fallback rate is elevated"
          description: "More than 3 AI provider model fallbacks occurred in the last 5 minutes. Primary model may be degraded."

      # 10. Alert if end-to-end HTTP request latency p95 exceeds 20 seconds
      - alert: HighEndToEndLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{path="/chat"}[5m])) > 20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High end-to-end request latency detected"
          description: "95th percentile end-to-end request latency on /chat exceeds 20 seconds. No single component may be failing, but user experience is degraded."
