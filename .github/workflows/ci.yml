name: CI/CD Pipeline — Bridgestone IT Agent

on:
  push:
    branches: [ main, feature/*, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Linting, Static Checks & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Python Syntax & Lint Checks
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run Backend Unit Tests
        env:
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY: ci-test-secret-key-123456
          ALGORITHM: HS256
          LLM_PROVIDER: mock
          USE_MOCK_SERVICENOW: true
          SERVICENOW_ENABLED: false
        run: |
          pytest backend/tests/ -v --tb=short

  frontend-checks:
    name: Frontend Linting & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Node.js Linting
        run: |
          cd frontend
          npm run lint

      - name: Verify Frontend Production Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          cd frontend
          npm run build

  docker-build-verification:
    name: Docker Multi-Stage Build Verification
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: bridgestone-backend:latest

      - name: Build Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          push: false
          tags: bridgestone-frontend:latest
